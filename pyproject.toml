[project]
name = "gawah"
version = "0.1.0"
description = "Witness and dispute layer for AI agents that spend money through PayPal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "cryptography",
    "python-dotenv",
    "pytest",
    "ruff",
    "gawah-contract",
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/gawah_engine"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "contract/tests"]
pythonpath = ["engine"]

[tool.ruff]
line-length = 100
extend-exclude = ["web"]

[tool.uv.workspace]
members = ["contract", "system1"]

[tool.uv.sources]
gawah-contract = { workspace = true }

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
